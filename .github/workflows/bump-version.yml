name: bump VERSION to tag

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["install CI"]
    types: [completed]

permissions:
  contents: write

jobs:
  bump:
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Sync VERSION to latest tag
        run: |
          set -e
          # get latest tag like v0.1.24, strip v
          latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          [ -z "$latest" ] && latest="v0.1.24"
          ver=${latest#v}
          cur=$(cat VERSION 2>/dev/null | tr -d '\r\n ' || echo "")
          echo "latest tag: $latest -> ver $ver, current VERSION file: $cur"
          if [ "$ver" = "$cur" ]; then
            echo "VERSION already $ver — nothing to do"
            exit 0
          fi
          echo "$ver" > VERSION
          # keep embedded fallback in install.sh in sync so curl|bash offline still shows right version
          if grep -q '|| echo "0\.' install.sh 2>/dev/null; then
            sed -i "s/|| echo \"0\.[^\"]*\"/|| echo \"$ver\"/g" install.sh
            sed -i "s/INSTALLER_VERSION=\"0\.[^\"]*\"/INSTALLER_VERSION=\"$ver\"/g" install.sh
          fi
          git config user.name "openOODA Auto-Release"
          git config user.email "ops@openooda.org"
          git add VERSION install.sh 2>/dev/null || git add VERSION
          # avoid triggering auto-release loop if commit is just VERSION bump
          git commit -m "chore: bump VERSION to $ver [skip ci]" || exit 0
          git push origin HEAD:main
