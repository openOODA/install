# ==============================================================================
# sync-hub: Server-Independent Zero-Trust GitHub Action
#
# Polls every canonical product repo across the openOODA-* orgs, rebuilds any
# repo whose master SHA moved (or whose binary is absent from the hub Release),
# and republishes the single openOODA/install Release pool plus the catalog
# COMMIT_LEDGER / SHA256SUMS. All compilation happens on GitHub-hosted runners
# with stdout/stderr discarded so no .oo source ever reaches public logs.
# ==============================================================================

name: sync-hub

# Fleet law: workflow_dispatch ONLY — zero GitHub CI/CD auto-triggers
# (no push:, pull_request:, schedule:, or repository_dispatch:).

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to force-rebuild (name or 'all')"
        required: false
        default: "all"

concurrency:
  group: sync-hub
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.OODA_ORG_TOKEN }}
      RELEASE_REPO: openOODA/install
      CATALOG_REPO: openOODA/catalog
    steps:
      - name: Checkout install and catalog
        uses: actions/checkout@v4
        with:
          repository: openOODA/install
          token: ${{ secrets.OODA_ORG_TOKEN }}
          path: install
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: openOODA/catalog
          token: ${{ secrets.OODA_ORG_TOKEN }}
          path: catalog
          persist-credentials: false

      - name: Resolve canonical packages and changed repos (single GraphQL call)
        id: resolve
        run: |
          set -euo pipefail
          # The compiler trusts a root only when it can name it, and it
          # refuses a root under /tmp, so every root lives under $HOME.
          # GitHub does not expand $HOME in an env: block, so they are set
          # here where the shell expands them.
          BOOTSTRAP="$HOME/.openooda/bootstrap"
          WORK_ROOT="$HOME/.openooda/build-work"
          OUT_ROOT="$HOME/.openooda/hub-out"
          cd catalog
          declare -A GDEF=()
          while IFS= read -r line; do
            line="${line%%#*}"
            [[ "$line" =~ ^[[:space:]]*@([A-Za-z0-9_-]+)[[:space:]]*=[[:space:]]*(.*)$ ]] || continue
            GDEF["${BASH_REMATCH[1]}"]="${BASH_REMATCH[2]}"
          done < groups.oot
          expand() {
            local want="$1" out="" seen=" " tok g
            local -a queue=("$want")
            while ((${#queue[@]})); do
              g="${queue[0]}"; queue=("${queue[@]:1}")
              [[ "$seen" == *" $g "* ]] && continue
              seen="$seen$g "
              for tok in ${GDEF[$g]:-}; do
                if [[ "$tok" == @* ]]; then queue+=("${tok#@}"); else out="$out $tok"; fi
              done
            done
            printf '%s\n' $out | awk 'NF && !seen[$0]++'
          }
          expand all > /tmp/pkgs.txt
          echo "canonical packages: $(wc -l < /tmp/pkgs.txt)"

          FORCED="${{ inputs.package }}"
          [ "$FORCED" = "null" ] && FORCED=""
          gh_retry() {
            local tries=0
            until "$@"; do
              tries=$((tries+1))
              [ "$tries" -ge 4 ] && return 1
              sleep $((tries * 4))
            done
          }
          ORGS="openOODA-core openOODA-system openOODA-apps openOODA-games"
          : > /tmp/repo-map.txt
          for org in $ORGS; do
            gh_retry gh api "orgs/$org/repos?per_page=100" --paginate -q '.[] | select(.archived == false) | .name' | while read -r r; do
              printf '%s %s/%s\n' "$r" "$org" "$r" >> /tmp/repo-map.txt
            done
          done
          declare -A REPO_OF=()
          while read -r name orgrepo; do
            if grep -qx "$name" /tmp/pkgs.txt; then REPO_OF[$name]="$orgrepo"; fi
          done < /tmp/repo-map.txt

          # Query master SHA (only the target repo when single-package dispatch).
          {
            echo 'query {'
            i=0
            for pkg in $(cat /tmp/pkgs.txt); do
              if [ -n "$FORCED" ] && [ "$FORCED" != "all" ] && [ "$pkg" != "$FORCED" ]; then continue; fi
              repo="${REPO_OF[$pkg]:-}"
              [ -z "$repo" ] && continue
              org="${repo%%/*}"; name="${repo##*/}"
              printf 'r%d: repository(owner:"%s",name:"%s") { object(expression:"master") { ... on Commit { oid } } }\n' "$i" "$org" "$name"
              printf '%s\n' "$i $pkg $repo" >> /tmp/gql-index.txt
              i=$((i+1))
            done
            echo '}'
          } > /tmp/shas.graphql
          gh_retry gh api graphql -f query="$(cat /tmp/shas.graphql)" > /tmp/shas.json
          : > /tmp/current-sha.txt
          while read -r i pkg repo; do
            sha="$(jq -r ".data.r$i.object.oid // empty" /tmp/shas.json)"
            [ -n "$sha" ] && printf '%s %s %s\n' "$pkg" "$repo" "$sha" >> /tmp/current-sha.txt
          done < /tmp/gql-index.txt

          LEDGER=/tmp/COMMIT_LEDGER.json
          if [ -f COMMIT_LEDGER ]; then cp COMMIT_LEDGER "$LEDGER"; else echo '{}' > "$LEDGER"; fi
          TAG="$(gh api repos/$RELEASE_REPO/releases/latest -q .tag_name)"
          echo "release tag: $TAG"
          gh release view "$TAG" -R "$RELEASE_REPO" --json assets -q '.assets[].name' | sort > /tmp/release-assets.txt

          FORCED="${{ inputs.package }}"
          [ "$FORCED" = "null" ] && FORCED=""
          : > /tmp/changed.txt
          while read -r pkg repo sha; do
            old="$(jq -r --arg k "$repo" '.[$k] // empty' "$LEDGER")"
            asset="$pkg-linux-x86_64"
            [ "$pkg" = "ooda-runtime" ] && asset="libooda-runtime.a"
            [ "$pkg" = "ooda-standard" ] && asset="ooda-standard-linux-x86_64.tar.gz"
            need=0
            if [ -n "$FORCED" ] && [ "$FORCED" != "all" ]; then
              [ "$FORCED" = "$pkg" ] && need=1
            else
              [ "$FORCED" = "all" ] && need=1
              [ "$old" != "$sha" ] && need=1
              grep -qx "$asset" /tmp/release-assets.txt || need=1
            fi
            if [ "$need" = "1" ]; then printf '%s %s %s\n' "$pkg" "$repo" "$sha" >> /tmp/changed.txt; fi
          done < /tmp/current-sha.txt

          n=$(wc -l < /tmp/changed.txt | tr -d ' ')
          echo "changed/missing: $n"
          if [ "$n" = "0" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

      - name: Exit early when nothing changed
        if: steps.resolve.outputs.skip == 'true'
        run: echo "no repo SHA changed and all binaries present; nothing to do"

      - name: Fetch bootstrap toolchain (outside checkout)
        if: steps.resolve.outputs.skip == 'false'
        run: |
          set -euo pipefail
          # The compiler trusts a root only when it can name it, and it
          # refuses a root under /tmp, so every root lives under $HOME.
          # GitHub does not expand $HOME in an env: block, so they are set
          # here where the shell expands them.
          BOOTSTRAP="$HOME/.openooda/bootstrap"
          WORK_ROOT="$HOME/.openooda/build-work"
          OUT_ROOT="$HOME/.openooda/hub-out"
          TAG="$(gh api repos/$RELEASE_REPO/releases/latest -q .tag_name)"
          mkdir -p "$BOOTSTRAP"
          gh release download "$TAG" -R "$RELEASE_REPO" -D "$BOOTSTRAP" \
            --pattern 'ooda-compiler-linux-x86_64' --pattern 'libooda-runtime*.a' --clobber
          mv -f "$BOOTSTRAP/ooda-compiler-linux-x86_64" "$BOOTSTRAP/ooda-compiler"
          chmod +x "$BOOTSTRAP/ooda-compiler"
          mkdir -p "$HOME/.openooda/bin" "$WORK_ROOT"
          cp -f "$BOOTSTRAP"/libooda-runtime*.a "$HOME/.openooda/bin/"
          cp -f "$BOOTSTRAP/ooda-compiler" "$HOME/.openooda/bin/ooda-compiler"
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/openOODA-core/ooda-standard.git" "$HOME/.openooda/ooda-standard" >/dev/null 2>&1
          ln -sfn "$HOME/.openooda/ooda-standard" "$WORK_ROOT/ooda-standard"
          test -f "$HOME/.openooda/ooda-standard/core/anchor.oo" && echo "bootstrap ready"

      - name: Build changed repos and stage stripped binaries
        if: steps.resolve.outputs.skip == 'false'
        run: |
          set -uo pipefail
          # The compiler trusts a root only when it can name it, and it
          # refuses a root under /tmp, so every root lives under $HOME.
          # GitHub does not expand $HOME in an env: block, so they are set
          # here where the shell expands them.
          BOOTSTRAP="$HOME/.openooda/bootstrap"
          WORK_ROOT="$HOME/.openooda/build-work"
          OUT_ROOT="$HOME/.openooda/hub-out"
          mkdir -p "$WORK_ROOT" "$OUT_ROOT"
          : > /tmp/built.txt
          bin_candidates() {
            case "$1" in
              ooda-compiler)   printf 'ooda-compiler\noodac\n';;
              ooda-runtime)    printf 'libooda-runtime.a\n';;
              ooda-language)   printf 'ooda-language\nooda-lsp\noolsp\n';;
              ooda-bridge)     printf 'ooda-bridge\nooda-mcp\noomcp\n';;
              ooda-filesystem) printf 'ooda-filesystem\nooda-filesystem-linux-x86_64\noofs\noofs-linux-x86_64\noocp\noocp-linux-x86_64\n';;
              ooda-hardware)   printf 'ooda-hardware\nooda-hardware-linux-x86_64\noohw\noohw-linux-x86_64\noohwinfo\noohwinfo-linux-x86_64\n';;
              *)               printf '%s\n%s-linux-x86_64\n' "$1" "$1";;
            esac
          }
          while read -r pkg repo sha; do
            [ -z "$pkg" ] && continue
            echo "=== build $pkg ($repo)"
            rm -rf "$WORK_ROOT/$pkg"
            if ! git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/$repo.git" "$WORK_ROOT/$pkg" >/dev/null 2>&1; then
              echo "warn: clone failed for $repo"; continue
            fi
            cd "$WORK_ROOT/$pkg"
            # What this run actually built: the commit it came from and the
            # version, capabilities and dependencies the package declares there.
            built_sha="$(git rev-parse HEAD 2>/dev/null || echo "")"
            pkg_ver=""; pkg_caps=""; pkg_deps=""
            if [ -f ooda.pkg ]; then
              pkg_ver="$(sed -n 's/^version=//p' ooda.pkg | head -1)"
              pkg_caps="$(sed -n 's/^caps=//p' ooda.pkg | head -1)"
              pkg_deps="$(sed -n 's/^deps=//p' ooda.pkg | head -1)"
            fi
            if [ "$pkg" = "ooda-standard" ]; then
              if [ -f core/anchor.oo ] && tar --exclude='.git' --exclude='.ooda-cache' --exclude='bin' --exclude='dist' \
                  -czf "$OUT_ROOT/ooda-standard-linux-x86_64.tar.gz.tmp" . && [ -s "$OUT_ROOT/ooda-standard-linux-x86_64.tar.gz.tmp" ]; then
                chmod 0644 "$OUT_ROOT/ooda-standard-linux-x86_64.tar.gz.tmp"
                mv -f "$OUT_ROOT/ooda-standard-linux-x86_64.tar.gz.tmp" "$OUT_ROOT/ooda-standard-linux-x86_64.tar.gz"
                printf '%s %s %s %s %s %s\n' "$pkg" "$repo" "$built_sha" "$pkg_ver" "$pkg_caps" "$pkg_deps" >> /tmp/built.txt
                echo "staged ooda-standard -> ooda-standard-linux-x86_64.tar.gz"
              else
                rm -f "$OUT_ROOT/ooda-standard-linux-x86_64.tar.gz.tmp"
                echo "error: failed to stage ooda-standard archive" >&2
                exit 1
              fi
              cd /
              rm -rf "$WORK_ROOT/$pkg"
              ln -sfn "$BOOTSTRAP/ooda-standard" "$WORK_ROOT/ooda-standard"
              continue
            fi
            if [ "$pkg" = "ooda" ] && [ ! -d "$WORK_ROOT/ooda-compiler" ]; then
              if ! git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/openOODA-core/ooda-compiler.git" "$WORK_ROOT/ooda-compiler" >/dev/null 2>&1; then
                echo "error: helper clone failed for openOODA-core/ooda-compiler" >&2
                exit 1
              fi
            fi
            if [ -f Makefile ]; then
              # Every product builds against the published runtime libraries.
              # ooda-runtime is the exception: it packs those libraries itself,
              # so its root is its own tree and the published archives are only
              # the bootstrap it starts from.
              # Passed through env: an unquoted expansion is not recognised as
              # an assignment prefix, so the shell would try to execute it.
              RUNTIME_ENV="OODA_RUNTIME_ROOT=$HOME/.openooda/bin"
              [ "$pkg" = "ooda-runtime" ] && RUNTIME_ENV="BOOTSTRAP_RUNTIME_ROOT=$HOME/.openooda/bin"
              OODA_COMPILER="$BOOTSTRAP/ooda-compiler" OODA_COMPILER_BIN="$BOOTSTRAP/ooda-compiler" \
                OODA_STANDARD_ROOT="$HOME/.openooda/ooda-standard" \
                BOOTSTRAP_FIXED_POINT=0 OO_LIST_AMBIENT_QUOTA=34359738368 OODA_NO_JAIL=1 \
                env $RUNTIME_ENV make build >/dev/null 2>&1 || \
              OODA_COMPILER="$BOOTSTRAP/ooda-compiler" OODA_COMPILER_BIN="$BOOTSTRAP/ooda-compiler" \
                OODA_STANDARD_ROOT="$HOME/.openooda/ooda-standard" \
                BOOTSTRAP_FIXED_POINT=0 OO_LIST_AMBIENT_QUOTA=34359738368 OODA_NO_JAIL=1 \
                env $RUNTIME_ENV make >/dev/null 2>&1 || true
            fi
            bin=""
            while IFS= read -r cand; do
              for rel in "dist/$cand" "bin/$cand" "core/lib/$cand" "scripts/lib/$cand" "$cand"; do
                if [ -f "$rel" ] && [ -s "$rel" ]; then bin="$rel"; break 2; fi
              done
            done < <(bin_candidates "$pkg")
            if [ -n "$bin" ]; then
              asset="$pkg-linux-x86_64"; [ "$pkg" = "ooda-runtime" ] && asset="libooda-runtime.a"
              cp -f "$WORK_ROOT/$pkg/$bin" "$OUT_ROOT/$asset"
              if [ "$pkg" != "ooda-runtime" ]; then strip --strip-all "$OUT_ROOT/$asset"; fi
              if [ "$pkg" = "ooda-runtime" ] && [ -f "$WORK_ROOT/$pkg/dist/ooda-runtime" ]; then
                cp -f "$WORK_ROOT/$pkg/dist/ooda-runtime" "$OUT_ROOT/ooda-runtime-linux-x86_64"
                strip --strip-all "$OUT_ROOT/ooda-runtime-linux-x86_64"
              fi
              if [ "$pkg" = "ooda-runtime" ] && [ -s "$WORK_ROOT/$pkg/core/sec/cap/cap_table.oot" ]; then
                cp -f "$WORK_ROOT/$pkg/core/sec/cap/cap_table.oot" "$OUT_ROOT/cap_table.oot"
              fi
              printf '%s %s %s %s %s %s\n' "$pkg" "$repo" "$built_sha" "$pkg_ver" "$pkg_caps" "$pkg_deps" >> /tmp/built.txt
              echo "built $pkg -> $asset"
            else
              echo "error: no binary produced for $pkg" >&2
              exit 1
            fi
            cd /
            rm -rf "$WORK_ROOT/$pkg" "$WORK_ROOT/ooda-compiler"
          done < /tmp/changed.txt
          echo "build pass complete"

      - name: Publish release assets and master SHA256SUMS
        if: steps.resolve.outputs.skip == 'false'
        run: |
          set -euo pipefail
          # The compiler trusts a root only when it can name it, and it
          # refuses a root under /tmp, so every root lives under $HOME.
          # GitHub does not expand $HOME in an env: block, so they are set
          # here where the shell expands them.
          BOOTSTRAP="$HOME/.openooda/bootstrap"
          WORK_ROOT="$HOME/.openooda/build-work"
          OUT_ROOT="$HOME/.openooda/hub-out"
          TAG="$(gh api repos/$RELEASE_REPO/releases/latest -q .tag_name)"
          mkdir -p "$OUT_ROOT" /tmp/prev-out
          gh release download "$TAG" -R "$RELEASE_REPO" -D /tmp/prev-out --clobber
          cp -f "$OUT_ROOT"/* /tmp/prev-out/
          : > /tmp/keep-assets.txt
          while read -r pkg; do
            asset="$pkg-linux-x86_64"
            [ "$pkg" = "ooda-runtime" ] && asset="libooda-runtime.a"
            [ "$pkg" = "ooda-standard" ] && asset="ooda-standard-linux-x86_64.tar.gz"
            printf '%s\n' "$asset" >> /tmp/keep-assets.txt
          done < /tmp/pkgs.txt
          printf '%s\n' \
            "ooda-runtime-linux-x86_64" \
            "cap_table.oot" \
            "openooda-linux-x86_64" \
            "openooda-codex-linux-x86_64.tar.gz" \
            "ooda-os-x86_64.iso" \
            "ooda-buildbox-x86_64.tar.gz" >> /tmp/keep-assets.txt
          for f in /tmp/prev-out/libooda-runtime*.a; do
            [ -e "$f" ] || continue
            printf '%s\n' "$(basename "$f")" >> /tmp/keep-assets.txt
          done
          for f in /tmp/prev-out/*; do
            [ -e "$f" ] || continue
            base="$(basename "$f")"
            if ! grep -qx "$base" /tmp/keep-assets.txt; then rm -f "$f"; fi
          done
          rm -f /tmp/prev-out/SHA256SUMS /tmp/prev-out/SHA256SUMS.sig
          ( cd /tmp/prev-out && find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort | xargs -r sha256sum > "$OUT_ROOT/SHA256SUMS" )
          ( cd /tmp/prev-out && sha256sum -c "$OUT_ROOT/SHA256SUMS" --quiet ) && echo "sums self-check OK"
          rm -rf /tmp/prev-out
          test -s "$OUT_ROOT/SHA256SUMS"
          gh release upload "$TAG" "$OUT_ROOT"/* --clobber -R "$RELEASE_REPO"
          echo "published $(find "$OUT_ROOT" -maxdepth 1 -type f | wc -l) updated assets"

      - name: Update catalog COMMIT_LEDGER and SHA256SUMS
        if: steps.resolve.outputs.skip == 'false'
        run: |
          set -euo pipefail
          # The compiler trusts a root only when it can name it, and it
          # refuses a root under /tmp, so every root lives under $HOME.
          # GitHub does not expand $HOME in an env: block, so they are set
          # here where the shell expands them.
          BOOTSTRAP="$HOME/.openooda/bootstrap"
          WORK_ROOT="$HOME/.openooda/build-work"
          OUT_ROOT="$HOME/.openooda/hub-out"
          cd catalog
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/openOODA/catalog.git"
          python3 - <<'PY'
          import base64, json, os, urllib.request

          TOKEN = os.environ["GH_TOKEN"]

          def api(path):
              req = urllib.request.Request(
                  "https://api.github.com" + path,
                  headers={"Authorization": "bearer " + TOKEN,
                           "Accept": "application/vnd.github+json",
                           "User-Agent": "sync-hub"})
              return json.loads(urllib.request.urlopen(req, timeout=60).read())

          def declares(repo, ref):
              """What a package declares at a commit: version, caps, deps."""
              try:
                  d = api("/repos/%s/contents/ooda.pkg?ref=%s" % (repo, ref))
                  body = base64.b64decode(d["content"]).decode()
              except Exception:
                  return None
              out = {}
              for line in body.splitlines():
                  if "=" in line:
                      k, v = line.split("=", 1)
                      out[k] = v
              return out

          merged = json.load(open('/tmp/COMMIT_LEDGER.json'))
          pkg2repo = {}
          for line in open('/tmp/repo-map.txt'):
              p = line.split()
              if len(p) == 2:
                  pkg2repo[p[0]] = p[1]
          # What this run built, and what each package declares at the commit
          # this index attests.
          built = {}
          for line in open('/tmp/built.txt'):
              p = line.split()
              if len(p) >= 6:
                  built[p[0]] = {"repo": p[1], "sha": p[2], "ver": p[3], "caps": p[4], "deps": p[5]}
              elif len(p) == 3:
                  built[p[0]] = {"repo": p[1], "sha": p[2], "ver": "", "caps": "", "deps": ""}
          for pkg, b in built.items():
              if b["sha"]:
                  merged[b["repo"]] = b["sha"]
          resolved = {}
          for line in open('/tmp/current-sha.txt'):
              p = line.split()
              if len(p) == 3:
                  resolved[p[0]] = p[2]
          rows = []
          for line in open('index').read().splitlines():
              f = line.split("|")
              if len(f) != 5:
                  continue
              name = f[0]
              b = built.get(name, {})
              ver = b.get("ver", "")
              caps = b.get("caps", "")
              deps = b.get("deps", "")
              if not ver:
                  # Not rebuilt this run: attest what the package declares at
                  # the commit this index already names.
                  sha = resolved.get(name, "")
                  repo = pkg2repo.get(name, "")
                  d = declares(repo, sha) if repo and sha else None
                  if d:
                      # A key the descriptor does not carry leaves the
                      # catalog's value alone; an empty one is honored.
                      if "version" in d: ver = d["version"]
                      if "caps" in d: caps = d["caps"]
                      if "deps" in d: deps = d["deps"]
              if ver:
                  rows.append("%s|%s|%s|%s|%s" % (name, ver, caps, deps, f[4]))
              else:
                  rows.append(line)
          with open('index', 'w') as f:
              f.write("\n".join(rows) + "\n")
          with open('COMMIT_LEDGER', 'w') as f:
              json.dump(merged, f, indent=2, sort_keys=True)
              f.write('\n')
          print("index reconciled: %d rows" % len(rows))
          PY
          # The index now names the versions this run built, so the layer
          # descriptors, their digests and the signature are regenerated from
          # those rows rather than left to describe an older release.
          OODA_COMPILER="$HOME/.openooda/bin/ooda-compiler" OODA_RUNTIME_ROOT="$HOME/.openooda/bin" \
            OODA_STANDARD_ROOT="$HOME/.openooda/ooda-standard" make sync
          cp "$OUT_ROOT/SHA256SUMS" SHA256SUMS
          git add -A
          if git diff --cached --quiet; then echo "catalog unchanged"; else
            git commit -m "chore(catalog): sync-hub index, descriptors, ledger + sums [skip ci]"
            git push origin HEAD:master
          fi
