# ==============================================================================
# sync-hub: Server-Independent Zero-Trust GitHub Action
#
# Polls every canonical product repo across the openOODA-* orgs, rebuilds any
# repo whose master SHA moved (or whose binary is absent from the hub Release),
# and republishes the single openOODA/install Release pool plus the catalog
# COMMIT_LEDGER / SHA256SUMS. All compilation happens on GitHub-hosted runners
# with stdout/stderr discarded so no .oo source ever reaches public logs.
# ==============================================================================

name: sync-hub

# Fleet law: workflow_dispatch ONLY — zero GitHub CI/CD auto-triggers
# (no push:, pull_request:, schedule:, or repository_dispatch:).

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to force-rebuild (name or 'all')"
        required: false
        default: "all"

concurrency:
  group: sync-hub
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.OODA_ORG_TOKEN }}
      RELEASE_REPO: openOODA/install
      CATALOG_REPO: openOODA/catalog
      BOOTSTRAP: /tmp/ooda-bootstrap
      WORK_ROOT: /tmp/build-work
      OUT_ROOT: /tmp/hub-out
    steps:
      - name: Checkout install and catalog
        uses: actions/checkout@v4
        with:
          repository: openOODA/install
          token: ${{ secrets.OODA_ORG_TOKEN }}
          path: install
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: openOODA/catalog
          token: ${{ secrets.OODA_ORG_TOKEN }}
          path: catalog
          persist-credentials: false

      - name: Resolve canonical packages and changed repos (single GraphQL call)
        id: resolve
        run: |
          set -euo pipefail
          cd catalog
          declare -A GDEF=()
          while IFS= read -r line; do
            line="${line%%#*}"
            [[ "$line" =~ ^[[:space:]]*@([A-Za-z0-9_-]+)[[:space:]]*=[[:space:]]*(.*)$ ]] || continue
            GDEF["${BASH_REMATCH[1]}"]="${BASH_REMATCH[2]}"
          done < groups.oot
          expand() {
            local want="$1" out="" seen=" " tok g
            local -a queue=("$want")
            while ((${#queue[@]})); do
              g="${queue[0]}"; queue=("${queue[@]:1}")
              [[ "$seen" == *" $g "* ]] && continue
              seen="$seen$g "
              for tok in ${GDEF[$g]:-}; do
                if [[ "$tok" == @* ]]; then queue+=("${tok#@}"); else out="$out $tok"; fi
              done
            done
            printf '%s\n' $out | awk 'NF && !seen[$0]++'
          }
          expand all > /tmp/pkgs.txt
          echo "canonical packages: $(wc -l < /tmp/pkgs.txt)"

          ORGS="openOODA-core openOODA-kernel openOODA-OS openOODA-tools openOODA-DE openOODA-apps openOODA-cloud openOODA-agents"
          : > /tmp/repo-map.txt
          for org in $ORGS; do
            gh api "orgs/$org/repos?per_page=100" --paginate -q '.[].name' | while read -r r; do
              printf '%s %s/%s\n' "$r" "$org" "$r" >> /tmp/repo-map.txt
            done
          done
          declare -A REPO_OF=()
          while read -r name orgrepo; do
            if grep -qx "$name" /tmp/pkgs.txt; then REPO_OF[$name]="$orgrepo"; fi
          done < /tmp/repo-map.txt

          # One GraphQL query for every mapped repo's master SHA.
          {
            echo 'query {'
            i=0
            for pkg in $(cat /tmp/pkgs.txt); do
              repo="${REPO_OF[$pkg]:-}"
              [ -z "$repo" ] && continue
              org="${repo%%/*}"; name="${repo##*/}"
              printf 'r%d: repository(owner:"%s",name:"%s") { object(expression:"master") { ... on Commit { oid } } }\n' "$i" "$org" "$name"
              printf '%s\n' "$i $pkg $repo" >> /tmp/gql-index.txt
              i=$((i+1))
            done
            echo '}'
          } > /tmp/shas.graphql
          gh api graphql -f query="$(cat /tmp/shas.graphql)" > /tmp/shas.json
          : > /tmp/current-sha.txt
          while read -r i pkg repo; do
            sha="$(jq -r ".data.r$i.object.oid // empty" /tmp/shas.json)"
            [ -n "$sha" ] && printf '%s %s %s\n' "$pkg" "$repo" "$sha" >> /tmp/current-sha.txt
          done < /tmp/gql-index.txt

          LEDGER=/tmp/COMMIT_LEDGER.json
          if [ -f COMMIT_LEDGER ]; then cp COMMIT_LEDGER "$LEDGER"; else echo '{}' > "$LEDGER"; fi
          TAG="$(gh api repos/$RELEASE_REPO/releases/latest -q .tag_name)"
          echo "release tag: $TAG"
          gh release view "$TAG" -R "$RELEASE_REPO" --json assets -q '.assets[].name' | sort > /tmp/release-assets.txt

          FORCED="${{ inputs.package }}"
          [ "$FORCED" = "null" ] && FORCED=""
          : > /tmp/changed.txt
          while read -r pkg repo sha; do
            old="$(jq -r --arg k "$repo" '.[$k] // empty' "$LEDGER")"
            asset="$pkg-linux-x86_64"
            [ "$pkg" = "oodar" ] && asset="liboodar.a"
            [ "$pkg" = "oostd" ] && asset="oostd-linux-x86_64.tar.gz"
            need=0
            if [ -n "$FORCED" ] && [ "$FORCED" != "all" ]; then
              [ "$FORCED" = "$pkg" ] && need=1
            else
              [ "$FORCED" = "all" ] && need=1
              [ "$old" != "$sha" ] && need=1
              grep -qx "$asset" /tmp/release-assets.txt || need=1
            fi
            if [ "$need" = "1" ]; then printf '%s %s %s\n' "$pkg" "$repo" "$sha" >> /tmp/changed.txt; fi
          done < /tmp/current-sha.txt

          n=$(wc -l < /tmp/changed.txt | tr -d ' ')
          echo "changed/missing: $n"
          if [ "$n" = "0" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

      - name: Exit early when nothing changed
        if: steps.resolve.outputs.skip == 'true'
        run: echo "no repo SHA changed and all binaries present; nothing to do"

      - name: Fetch bootstrap toolchain (outside checkout)
        if: steps.resolve.outputs.skip == 'false'
        run: |
          set -euo pipefail
          TAG="$(gh api repos/$RELEASE_REPO/releases/latest -q .tag_name)"
          mkdir -p "$BOOTSTRAP"
          gh release download "$TAG" -R "$RELEASE_REPO" -D "$BOOTSTRAP" \
            --pattern 'oodac-linux-x86_64' --pattern 'liboodar.a' --clobber
          mv -f "$BOOTSTRAP/oodac-linux-x86_64" "$BOOTSTRAP/oodac"
          chmod +x "$BOOTSTRAP/oodac"
          mkdir -p "$HOME/.openooda/bin"
          cp -f "$BOOTSTRAP/liboodar.a" "$HOME/.openooda/bin/liboodar.a"
          cp -f "$BOOTSTRAP/oodac" "$HOME/.openooda/bin/oodac"
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/openOODA-core/oostd.git" "$BOOTSTRAP/oostd" >/dev/null 2>&1
          test -f "$BOOTSTRAP/oostd/core/anchor.oo" && echo "bootstrap ready"

      - name: Build changed repos and stage stripped binaries
        if: steps.resolve.outputs.skip == 'false'
        run: |
          set -uo pipefail
          mkdir -p "$WORK_ROOT" "$OUT_ROOT"
          : > /tmp/built.txt
          bin_candidates() {
            case "$1" in
              oodac)  printf 'oodac.real\noodac\n';;
              oodar)  printf 'liboodar.a\n';;
              oolsp)  printf 'oolsp\nooda-lsp\n';;
              oofs)   printf 'oofs\noofs-linux-x86_64\noocp\noocp-linux-x86_64\n';;
              oohw)   printf 'oohw\noohw-linux-x86_64\noohwinfo\noohwinfo-linux-x86_64\n';;
              ooperm) printf 'ooperm\nooperm-linux-x86_64\noochmod\noochmod-linux-x86_64\n';;
              *)      printf '%s\n%s-linux-x86_64\n' "$1" "$1";;
            esac
          }
          while read -r pkg repo sha; do
            [ -z "$pkg" ] && continue
            echo "=== build $pkg ($repo)"
            rm -rf "$WORK_ROOT/$pkg"
            if ! git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/$repo.git" "$WORK_ROOT/$pkg" >/dev/null 2>&1; then
              echo "warn: clone failed for $repo"; continue
            fi
            cd "$WORK_ROOT/$pkg"
            if [ "$pkg" = "oostd" ]; then
              if [ -f core/anchor.oo ] && tar --exclude='.git' --exclude='.ooda-cache' --exclude='bin' --exclude='dist' \
                  -czf "$OUT_ROOT/oostd-linux-x86_64.tar.gz.tmp" . && [ -s "$OUT_ROOT/oostd-linux-x86_64.tar.gz.tmp" ]; then
                chmod 0644 "$OUT_ROOT/oostd-linux-x86_64.tar.gz.tmp"
                mv -f "$OUT_ROOT/oostd-linux-x86_64.tar.gz.tmp" "$OUT_ROOT/oostd-linux-x86_64.tar.gz"
                printf '%s %s %s\n' "$pkg" "$repo" "$sha" >> /tmp/built.txt
                echo "staged oostd -> oostd-linux-x86_64.tar.gz"
              else
                rm -f "$OUT_ROOT/oostd-linux-x86_64.tar.gz.tmp"
                echo "error: failed to stage oostd archive" >&2
                exit 1
              fi
              cd /
              rm -rf "$WORK_ROOT/$pkg"
              continue
            fi
            if [ "$pkg" = "ooda" ] && [ ! -d "$WORK_ROOT/oodac" ]; then
              if ! git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/openOODA-core/oodac.git" "$WORK_ROOT/oodac" >/dev/null 2>&1; then
                echo "error: helper clone failed for openOODA-core/oodac" >&2
                exit 1
              fi
            fi
            if [ -f Makefile ]; then
              OODAC="$BOOTSTRAP/oodac" OODA_COMPILER="$BOOTSTRAP/oodac" OODAC_BIN="$BOOTSTRAP/oodac" \
                OODA_OOSTD_ROOT="$BOOTSTRAP/oostd" OODA_OODAR_ROOT="$BOOTSTRAP" \
                OO_LIST_AMBIENT_QUOTA=34359738368 OODA_NO_JAIL=1 \
                make build >/dev/null 2>&1 || \
              OODAC="$BOOTSTRAP/oodac" OODA_COMPILER="$BOOTSTRAP/oodac" OODAC_BIN="$BOOTSTRAP/oodac" \
                OODA_OOSTD_ROOT="$BOOTSTRAP/oostd" OODA_OODAR_ROOT="$BOOTSTRAP" \
                OO_LIST_AMBIENT_QUOTA=34359738368 OODA_NO_JAIL=1 \
                make >/dev/null 2>&1 || true
            fi
            bin=""
            while IFS= read -r cand; do
              for rel in "dist/$cand" "bin/$cand" "core/lib/$cand" "scripts/lib/$cand" "$cand"; do
                if [ -f "$rel" ] && [ -s "$rel" ]; then bin="$rel"; break 2; fi
              done
            done < <(bin_candidates "$pkg")
            if [ -n "$bin" ]; then
              asset="$pkg-linux-x86_64"; [ "$pkg" = "oodar" ] && asset="liboodar.a"
              cp -f "$WORK_ROOT/$pkg/$bin" "$OUT_ROOT/$asset"
              if [ "$pkg" != "oodar" ]; then strip --strip-all "$OUT_ROOT/$asset"; fi
              printf '%s %s %s\n' "$pkg" "$repo" "$sha" >> /tmp/built.txt
              echo "built $pkg -> $asset"
            else
              echo "error: no binary produced for $pkg" >&2
              exit 1
            fi
            cd /
            rm -rf "$WORK_ROOT/$pkg" "$WORK_ROOT/oodac"
          done < /tmp/changed.txt
          echo "build pass complete"

      - name: Publish release assets and master SHA256SUMS
        if: steps.resolve.outputs.skip == 'false'
        run: |
          set -euo pipefail
          TAG="$(gh api repos/$RELEASE_REPO/releases/latest -q .tag_name)"
          mkdir -p "$OUT_ROOT" /tmp/prev-out
          gh release download "$TAG" -R "$RELEASE_REPO" -D /tmp/prev-out --clobber
          cp -f "$OUT_ROOT"/* /tmp/prev-out/
          : > /tmp/keep-assets.txt
          while read -r pkg; do
            asset="$pkg-linux-x86_64"
            [ "$pkg" = "oodar" ] && asset="liboodar.a"
            [ "$pkg" = "oostd" ] && asset="oostd-linux-x86_64.tar.gz"
            printf '%s\n' "$asset" >> /tmp/keep-assets.txt
          done < /tmp/pkgs.txt
          printf '%s\n' \
            "openooda-linux-x86_64" \
            "openooda-codex-linux-x86_64.tar.gz" \
            "ooda-os-x86_64.iso" \
            "ooda-buildbox-x86_64.tar.gz" >> /tmp/keep-assets.txt
          for f in /tmp/prev-out/*; do
            [ -e "$f" ] || continue
            base="$(basename "$f")"
            if ! grep -qx "$base" /tmp/keep-assets.txt; then rm -f "$f"; fi
          done
          rm -f /tmp/prev-out/SHA256SUMS /tmp/prev-out/SHA256SUMS.sig
          ( cd /tmp/prev-out && find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort | xargs -r sha256sum > "$OUT_ROOT/SHA256SUMS" )
          ( cd /tmp/prev-out && sha256sum -c "$OUT_ROOT/SHA256SUMS" --quiet ) && echo "sums self-check OK"
          rm -rf /tmp/prev-out
          test -s "$OUT_ROOT/SHA256SUMS"
          gh release upload "$TAG" "$OUT_ROOT"/* --clobber -R "$RELEASE_REPO"
          echo "published $(find "$OUT_ROOT" -maxdepth 1 -type f | wc -l) updated assets"

      - name: Update catalog COMMIT_LEDGER and SHA256SUMS
        if: steps.resolve.outputs.skip == 'false'
        run: |
          set -euo pipefail
          cd catalog
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/openOODA/catalog.git"
          python3 - <<'PY'
          import json
          merged = json.load(open('/tmp/COMMIT_LEDGER.json'))
          pkg2repo = {}
          for line in open('/tmp/repo-map.txt'):
              p = line.split()
              if len(p) == 2:
                  pkg2repo[p[0]] = p[1]
          for line in open('/tmp/built.txt'):
              p = line.split()
              if len(p) == 3:
                  pkg, repo, sha = p
                  merged[repo] = sha
          with open('COMMIT_LEDGER', 'w') as f:
              json.dump(merged, f, indent=2, sort_keys=True)
              f.write('\n')
          PY
          cp /tmp/hub-out/SHA256SUMS SHA256SUMS
          git add COMMIT_LEDGER SHA256SUMS
          if git diff --cached --quiet; then echo "ledger unchanged"; else
            git commit -m "chore(catalog): sync-hub COMMIT_LEDGER + SHA256SUMS [skip ci]"
            git push origin HEAD:master
          fi
