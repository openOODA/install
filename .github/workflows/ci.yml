name: install CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck install.sh
        run: |
          sudo apt-get install -y shellcheck
          shellcheck --severity=warning install.sh
      - name: fail-closed sha256 contract
        run: bash tests/test_install.sh

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: dry-run install (banner + bar + command list)
        env:
          OPENOODA_DRY_RUN: '1'
          NO_COLOR: '1'
        run: |
          output=$(bash install.sh)
          echo "$output"
          for needle in \
            "observe → orient → decide → act →" \
            "openOODA" \
            "Welcome, " \
            "install dir:" \
            "100%" \
            "Try these commands" \
            "\$ ooda --help" \
            "\$ ooda build main.oo" \
            "\$ ooda run main.oo" \
            "\$ ooda init" \
            "\$ ooda token issue" \
            "Ready. Welcome to openOODA."; do
            echo "$output" | grep -qF -- "$needle" || { echo "missing: $needle"; exit 1; }
          done
          echo "$output" | grep -qF 'ooda install openOODA/std' \
            && { echo "command list still suggests std install (it is auto-cloned)"; exit 1; } \
            || true

  blackbox-gate:
    needs: [smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: checkout install
        uses: actions/checkout@v4
        with:
          path: install
      - name: install openOODA toolchain
        run: |
          set -euo pipefail
          curl -fsSL https://openooda.org/install.sh | bash
          echo "$HOME/.openooda/bin" >> "$GITHUB_PATH"
      - name: blackbox double-run on qa/ probes (RULES §1.10)
        working-directory: ${{ github.workspace }}/install
        env:
          OODA_FS_READDIR: ${{ github.workspace }}
          OODA_FS_WRITEDIR: ${{ github.workspace }}
          OODA_NO_JAIL: '1'
        run: |
          set -euo pipefail
          shopt -s nullglob
          count=0
          for f in qa/*.oo; do
            test -f "$f" || continue
            count=$((count + 1))
            base=$(basename "$f" .oo)
            ~/.openooda/bin/blackbox trace "$f" > "/tmp/${base}.trace1" 2>&1 || {
              echo "[blackbox-gate FAIL] trace non-zero exit on $f"
              exit 1
            }
            ~/.openooda/bin/blackbox trace "$f" > "/tmp/${base}.trace2" 2>&1 || {
              echo "[blackbox-gate FAIL] second trace non-zero exit on $f"
              exit 1
            }
            if ! diff -q "/tmp/${base}.trace1" "/tmp/${base}.trace2" >/dev/null; then
              echo "[blackbox-gate FAIL] non-deterministic trace on $f (double-run law violation, RULES §1.10)"
              diff "/tmp/${base}.trace1" "/tmp/${base}.trace2" | head -20
              exit 1
            fi
          done
          if [ "$count" -eq 0 ]; then
            echo "[blackbox-gate SKIP] no qa/*.oo in this repo"
            exit 0
          fi
          echo "[blackbox-gate OK] $count probes deterministic across double-run"

  auto-release:
    needs: [blackbox-gate]
    uses: openOODA/openOODA/.github/workflows/auto-release.yml@main
