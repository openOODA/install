name: install CI

on:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck installer + hub publisher + pkg fragments
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck --severity=warning install.sh publish-hub.sh pkg/*/profile.d.sh
      - name: bash -n syntax gate
        run: |
          bash -n install.sh
          bash -n publish-hub.sh
          for f in pkg/*/profile.d.sh; do bash -n "$f"; done
      - name: canonical repo root
        run: |
          set -euo pipefail
          want="AGENTS.md Makefile README.md VERSION anchor.oo core install.sh pkg publish-hub.sh tests versions.toml"
          have=$(find . -maxdepth 1 -mindepth 1 ! -name '.*' -printf '%f\n' | LC_ALL=C sort | tr '\n' ' ' | sed 's/ $//')
          test "$have" = "$want" || { echo "ERR root drift: [$have] != [$want]"; exit 1; }
          test "$(ls -d pkg/*/ | wc -l)" -eq 4
          echo "[tree OK] 11 canonical root entries; pkg/ carries apt dnf pacman winget"

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: dry-run install (banner + bar + command list)
        env:
          OPENOODA_DRY_RUN: '1'
          NO_COLOR: '1'
        run: |
          output=$(bash install.sh)
          echo "$output"
          for needle in \
            "openOODA" \
            "One release hub, one asset per component" \
            "oodac" \
            "Welcome to openOODA" \
            "prefix:" \
            "dry-run"; do
            echo "$output" | grep -qF -- "$needle" || { echo "missing: $needle"; exit 1; }
          done
          if echo "$output" | grep -qF 'ooda install openOODA-core/oostd'; then
            echo "command list still suggests std install (it is auto-cloned)"
            exit 1
          fi
      - name: --version probe
        run: bash install.sh --version | grep -qE 'openOODA installer [0-9]+\.[0-9]+\.[0-9]+'

  auto-release:
    needs: [lint, smoke]
    uses: openOODA/openOODA/.github/workflows/auto-release.yml@v2.10.44
