name: install CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck install.sh
        run: |
          sudo apt-get install -y shellcheck
          shellcheck --severity=warning install.sh
      - name: fail-closed sha256 contract
        run: bash tests/test_install.sh

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: dry-run install (banner + bar + command list)
        env:
          OPENOODA_DRY_RUN: '1'
          NO_COLOR: '1'
        run: |
          output=$(bash install.sh)
          echo "$output"
          for needle in \
            "observe → orient → decide → act →" \
            "openOODA" \
            "Welcome, " \
            "install dir:" \
            "100%" \
            "Try these commands" \
            "\$ ooda --help" \
            "\$ ooda build main.oo" \
            "\$ ooda run main.oo" \
            "\$ ooda init" \
            "\$ ooda token issue" \
            "Ready. Welcome to openOODA."; do
            echo "$output" | grep -qF -- "$needle" || { echo "missing: $needle"; exit 1; }
          done
          echo "$output" | grep -qF 'ooda install openOODA/std' \
            && { echo "command list still suggests std install (it is auto-cloned)"; exit 1; } \
            || true

  blackbox-gate:
    needs: [smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: checkout install
        uses: actions/checkout@v4
        with:
          path: install
      - name: checkout std
        uses: actions/checkout@v4
        with:
          repository: openOODA/std
          path: std
      - name: checkout oodac
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodac
          path: oodac
      - name: checkout oodar
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodar
          path: oodar
      - name: require compiler
        run: |
          test -x oodac/bin/oodac || chmod +x oodac/bin/oodac
          test -f oodar/core/blackbox/blackbox.c || { echo "missing oodar/core/blackbox/blackbox.c"; exit 1; }
      - name: install blackbox (download prebuilt from GitHub release)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.openooda/bin"
          curl -fsSL -o "$HOME/.openooda/bin/blackbox" \
            "https://github.com/openOODA/blackbox/releases/download/v0.0.10/blackbox-linux-x86_64"
          curl -fsSL -o "$HOME/.openooda/bin/blackbox.sha256" \
            "https://github.com/openOODA/blackbox/releases/download/v0.0.10/blackbox-linux-x86_64.sha256"
          expected=$(cut -d' ' -f1 "$HOME/.openooda/bin/blackbox.sha256")
          actual=$(sha256sum "$HOME/.openooda/bin/blackbox" | cut -d' ' -f1)
          test "$expected" = "$actual" || { echo "[blackbox-gate FAIL] sha256 mismatch"; exit 1; }
          chmod +x "$HOME/.openooda/bin/blackbox"
      - name: blackbox double-run on qa/ probes (RULES §1.10)
        working-directory: ${{ github.workspace }}/install
        env:
          OODA_FS_READDIR: ${{ github.workspace }}
          OODA_FS_WRITEDIR: ${{ github.workspace }}
          OODA_NO_JAIL: '1'
          OODA_COMPILER: ${{ github.workspace }}/oodac/bin/oodac
        run: |
          set -euo pipefail
          shopt -s nullglob
          count=0
          for f in qa/probe_*.oo; do
            test -f "$f" || continue
            count=$((count + 1))
            base=$(basename "$f" .oo)
            ~/.openooda/bin/blackbox diff "$f" > "/tmp/${base}.diff1" 2>&1 || {
              echo "[blackbox-gate FAIL] diff non-zero exit on $f"
              exit 1
            }
            ~/.openooda/bin/blackbox diff "$f" > "/tmp/${base}.diff2" 2>&1 || {
              echo "[blackbox-gate FAIL] second diff non-zero exit on $f"
              exit 1
            }
            if ! diff -q "/tmp/${base}.diff1" "/tmp/${base}.diff2" >/dev/null; then
              echo "[blackbox-gate FAIL] non-deterministic diff on $f (double-run law violation, RULES §1.10)"
              diff "/tmp/${base}.diff1" "/tmp/${base}.diff2" | head -20
              exit 1
            fi
          done
          if [ "$count" -eq 0 ]; then
            echo "[blackbox-gate SKIP] no qa/probe_*.oo in this repo"
            exit 0
          fi
          if [ -s .blackbox/flight.json ]; then
            ~/.openooda/bin/blackbox trace > /tmp/flight.trace1 2>&1 || {
              echo "[blackbox-gate FAIL] unreadable flight log"
              exit 1
            }
            ~/.openooda/bin/blackbox trace > /tmp/flight.trace2 2>&1 || {
              echo "[blackbox-gate FAIL] unreadable flight log on second read"
              exit 1
            }
            if ! diff -q /tmp/flight.trace1 /tmp/flight.trace2 >/dev/null; then
              echo "[blackbox-gate FAIL] non-deterministic flight trace"
              exit 1
            fi
            echo "[blackbox-gate OK] $count probes deterministic across double-run; flight log readable and deterministic"
          else
            echo "[blackbox-gate OK] $count probes deterministic across double-run; no flight log (no crashes recorded)"
          fi

  auto-release:
    needs: [blackbox-gate]
    uses: openOODA/openOODA/.github/workflows/auto-release.yml@v2.10.23
