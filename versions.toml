# openOODA version overrides for install.sh.
#
# All component binaries publish as assets on the openOODA/openOODA
# umbrella release (auto-release.yml). A pin value is a tag on that
# release — NOT a per-component version. Default: latest release.
# Pin a component to an older umbrella tag by uncommenting, e.g.:
# oodac = "v2.11.127"
# ooda = "v2.11.126"
# std clones openOODA-core/std; its pin is a git ref on that repo:
# std = "v1.0.88"
