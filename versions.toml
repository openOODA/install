# Canonical 66-package shipped version ledger for the openOODA ecosystem.
#
# All 66 canonical packages publish to the single release hub at
# https://github.com/openOODA/install (releases/latest and tag hub, verified
# against the master SHA256SUMS manifest). Entries below record the shipped
# release tag per package across @core (openOODA-core), @system (openOODA-system),
# @apps (openOODA-apps), and @games (openOODA-games), and supply fallback tags for
# per-repo openOODA-core downloads when an asset is absent from the hub.
# ooda-standard unpacks ooda-standard-linux-x86_64.tar.gz from
# openOODA/install@hub into $OPENOODA_HOME/ooda-standard.

[packages]
