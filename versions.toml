# openOODA version overrides for install.sh.
#
# Each L0 toolchain binary publishes from its openOODA-core/<repo> release
# (or a local dist file, or `gh release download`). A pin value is a tag on
# that component repo. Default: latest release. Example:
# oodac = "v0.11.63"
# oodar = "v4.0.90"
# std clones openOODA-core/std; its pin is a git ref on that repo:
# std = "v1.0.88"
